<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sin conexión — Unidad Sanitaria N°3" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1E3A8A" />
  <title>Sin conexión — US3</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/pwa.css" />
  <style>
    .offline-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: var(--bg-page);
    }
    .offline-card {
      max-width: 400px;
      padding: 32px 28px;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
    }
    .offline-card i { font-size: 48px; color: var(--color-primary); margin-bottom: 16px; display: block; }
    .offline-card h1 { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 8px; color: var(--navy-800); }
    .offline-card p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
  </style>
  <link rel="stylesheet" href="css/tabler-icons.min.css" />
</head>
<body>
  <main class="offline-page">
    <div class="offline-card">
      <i class="ti ti-wifi-off" aria-hidden="true"></i>
      <h1>Sin conexión a internet</h1>
      <p>
        No hay conexión en este momento. El acceso al panel y los datos del sistema
        requieren conexión por seguridad. Reintentá cuando vuelva la red.
      </p>
      <button type="button" class="btn btn-primary" onclick="location.reload()">
        <i class="ti ti-refresh"></i> Reintentar
      </button>
      <p style="margin-top:16px;font-size:12px;color:var(--text-muted)">
        Unidad Sanitaria N°3 · DPSP
      </p>
    </div>
  </main>
</body>
</html>
